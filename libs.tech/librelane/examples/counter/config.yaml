# ICsprout55 LibreLane flow test design (2026-09-25, validated)
DESIGN_NAME: counter
VERILOG_FILES: dir::src/counter.v
CLOCK_PERIOD: 10
CLOCK_PORT: clk
FP_CORE_UTIL: 30
PL_TARGET_DENSITY_PCT: 40
DIE_AREA: [0, 0, 100, 100]
VDD_NETS: [VDD]
GND_NETS: [VSS]
KLAYOUT_DRC_OPTIONS:
  densityRules: 0
KLAYOUT_LVS_OPTIONS:
  run_mode: deep
# Route the LVS step through our KLayout deck instead of Magic/Netgen.
# ICS55.KLayoutLVS is provided by libs.tech/librelane/librelane_plugin_ics55
# (add libs.tech/librelane to PYTHONPATH).  Magic DRC/stream-out stay off:
# PRIMARY_GDSII_STREAMOUT_TOOL is klayout and our magic tech file only does
# parasitic extraction, not DRC.
meta:
  flow: Classic
  substituting_steps:
    Magic.DRC: null
    Checker.MagicDRC: null
    Magic.SpiceExtraction: null
    Magic.StreamOut: null
    Magic.WriteLEF: null
    Odb.CheckDesignAntennaProperties: null
    Checker.IllegalOverlap: null
    KLayout.XOR: null
    Checker.XOR: null
    "-Netgen.LVS": OpenROAD.WriteCDL
    Netgen.LVS: ICS55.KLayoutLVS
# RC values: released LEF (clean-room; generated by libs.tech/pex/config_gen.py)
LAYERS_RC:
  "nom_*":
    MET1: {res: 0.1122, cap: 0.0007630}
    MET2: {res: 0.0914, cap: 0.0011069}
    MET3: {res: 0.0914, cap: 0.0011069}
    MET4: {res: 0.0914, cap: 0.0011069}
    MET5: {res: 0.0914, cap: 0.0006259}
    T4M2: {res: 0.0239, cap: 0.0001299}
VIAS_R:
  "nom_*":
    VIA1: {res: 2.5}
    VIA2: {res: 2.5}
    VIA3: {res: 2.5}
    VIA4: {res: 2.5}
    T4V2: {res: 2.5}
pdk::ics55*:
  STD_CELL_LIBRARY: ics55_LLSC_H7CR
  PAD_CELL_LIBRARY: ICsprout_55LLULP1233_IO_251013
